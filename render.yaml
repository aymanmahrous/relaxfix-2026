services:
  - type: web
    name: relaxfix-uae
    env: node
    plan: free
    
    # Build configuration
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    
    # Disk configuration
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    
    # Auto-deploy
    autoDeploy: true
    
    # Health check
    healthCheckPath: /
    
    # Timeout
    maxShutdownDelay: 30
