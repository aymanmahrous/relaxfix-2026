<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملف تعريفي - Relaxfix Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #0F172A; color: white; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .gold-text { color: #D4AF37; }
  </style>
</head>
<body>
  <div class="min-h-screen p-8">
    <div class="container mx-auto max-w-2xl">
      <!-- Header -->
      <div class="mb-10 text-center">
        <h1 class="text-5xl font-black gold-text mb-2">ملفك الشخصي</h1>
        <p class="text-slate-400">أدِر حجوزاتك وتتبع طلباتك</p>
      </div>

      <!-- Profile Card -->
      <div class="glass p-10 rounded-2xl mb-10">
        <div class="text-center mb-8">
          <div class="w-24 h-24 mx-auto bg-gradient-to-br from-yellow-500 to-yellow-700 rounded-full flex items-center justify-center text-5xl mb-4">👤</div>
          <h2 class="text-3xl font-black mb-2" id="userName">الزائر</h2>
          <p class="text-slate-400" id="userPhone">-</p>
        </div>
        <hr class="border-slate-700 mb-8">
        <div class="space-y-4">
          <div>
            <p class="text-slate-400 text-sm mb-2">رقم الهاتف</p>
            <p class="text-lg font-bold" id="displayPhone">-</p>
          </div>
          <div>
            <p class="text-slate-400 text-sm mb-2">المنطقة</p>
            <p class="text-lg font-bold" id="displayArea">-</p>
          </div>
          <div>
            <p class="text-slate-400 text-sm mb-2">تاريخ الانضمام</p>
            <p class="text-lg font-bold" id="joinDate">-</p>
          </div>
        </div>
        <button onclick="logout()" class="w-full mt-8 bg-red-500/20 hover:bg-red-500/30 border border-red-500 text-red-400 px-6 py-3 rounded-lg font-black transition-all">تسجيل الخروج</button>
      </div>

      <!-- My Orders -->
      <div class="glass p-10 rounded-2xl">
        <h3 class="text-2xl font-black gold-text mb-6">طلباتي</h3>
        <div id="myOrders" class="space-y-4">
          <p class="text-slate-400 text-center">جاري التحميل...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const phone = localStorage.getItem('userPhone') || 'لم تسجل الدخول';
    
    async function loadProfile() {
      if (phone === 'لم تسجل الدخول') {
        window.location.href = '/';
        return;
      }
      
      try {
        const res = await fetch(`/api/user/orders?phone=${encodeURIComponent(phone)}`);
        const orders = await res.json();
        
        if (orders.length > 0) {
          const first = orders[0];
          document.getElementById('userName').textContent = first.name || 'الزائر';
          document.getElementById('userPhone').textContent = first.phone;
          document.getElementById('displayPhone').textContent = first.phone;
          document.getElementById('displayArea').textContent = first.area || '-';
          document.getElementById('joinDate').textContent = new Date(first.created_at).toLocaleDateString('ar-AE');
        }
        
        const ordersHtml = orders.map(o => `
          <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl">
            <div class="flex justify-between items-start mb-2">
              <h4 class="font-black text-lg">${o.service}</h4>
              <span class="px-3 py-1 rounded-full text-sm font-bold
                ${o.status === 'new' ? 'bg-blue-500/30 text-blue-300' : ''}
                ${o.status === 'confirmed' ? 'bg-green-500/30 text-green-300' : ''}
                ${o.status === 'completed' ? 'bg-indigo-500/30 text-indigo-300' : ''}">
                ${o.status === 'new' ? '🆕 جديد' : o.status === 'confirmed' ? '✅ مؤكد' : '🏁 مكتمل'}
              </span>
            </div>
            <p class="text-slate-400 text-sm mb-2">📍 ${o.area} • 📅 ${new Date(o.created_at).toLocaleDateString('ar-AE')}</p>
            ${o.notes ? `<p class="text-slate-300 text-sm">💬 ${o.notes}</p>` : ''}
          </div>
        `).join('');
        
        document.getElementById('myOrders').innerHTML = ordersHtml || '<p class="text-slate-400 text-center">لا توجد طلبات</p>';
      } catch (err) {
        console.error('Error loading profile:', err);
        document.getElementById('myOrders').innerHTML = '<p class="text-red-400 text-center">خطأ في تحميل الطلبات</p>';
      }
    }
    
    function logout() {
      localStorage.removeItem('userPhone');
      window.location.href = '/';
    }
    
    loadProfile();
  </script>
</body>
</html>
